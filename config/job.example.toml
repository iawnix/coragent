# Explicit component-import example for --job-config; target routing and
# scientific bindings are configured independently.
# Prepare scientific environments independently with install_job_environment.py,
# then replace the example paths with their existing bindings.

[execution]
default_target = "local"

[execution.targets.local]
type = "local"
driver = "systemd"
scheduler = "none"
location = "controller"

[execution.targets.local.python]
manager = "conda"
conda_executable = "/opt/conda/bin/conda"
prefix = "/opt/coragent/envs/wrapper-20261009"
lock_ref = "/opt/coragent/locks/wrapper.lock"

# These Python-only methods use the selected target's RDKit/NumPy environment.
[execution.targets.local.bindings.structure]
# The installer binds its generated name-resolver.toml when no explicit resolver
# configuration is supplied. Remote targets need their own target-local path.
[execution.targets.local.bindings.structure.python]
manager = "conda"
conda_executable = "/opt/conda/bin/conda"
prefix = "/opt/coragent/envs/structure-20261009"
lock_ref = "/opt/coragent/locks/structure.lock"
[execution.targets.local.bindings.validation]
[execution.targets.local.bindings.validation.python]
manager = "conda"
conda_executable = "/opt/conda/bin/conda"
prefix = "/opt/coragent/envs/structure-20261009"
lock_ref = "/opt/coragent/locks/structure.lock"

[execution.targets.local.bindings.gaussian]
command = "/opt/gaussian/g16/g16"
activation_script = "/opt/gaussian/activate.sh"
[execution.targets.local.bindings.gaussian.environment]
GAUSS_SCRDIR = "{scratch}"

[execution.targets.local.bindings.xtb]
command = "/opt/xtb/bin/xtb"
activation_script = "/opt/xtb/activate.sh"

# CF22D uses its own complete Conda lock; no custom LD_PRELOAD is needed.
[execution.targets.local.bindings.pyscf]

[execution.targets.local.bindings.pyscf.python]
manager = "conda"
conda_executable = "/opt/conda/bin/conda"
prefix = "/opt/coragent/envs/cf22d-20261009"
lock_ref = "/opt/coragent/locks/cf22d.lock"

# Batch targets (local submission or SSH): see job.execution.example.toml.

# Optional molecular images; text reports need no rendering libraries.
[execution.targets.local.bindings.render.python]
manager = "conda"
conda_executable = "/opt/conda/bin/conda"
prefix = "/opt/coragent/envs/render-20261009"
lock_ref = "/opt/coragent/locks/render.lock"
