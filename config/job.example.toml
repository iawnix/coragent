["execution"]
"schema_version" = 2
"default_platform" = "local"

["execution"."platforms"]

["execution"."platforms"."local"]
"transport" = "local"
"default_scheduler" = "qrun"

["execution"."platforms"."local"."python"]
"manager" = "conda"
"conda_executable" = "/opt/conda/bin/conda"
"prefix" = "/opt/coragent/envs/wrapper-20261009"
"lock_ref" = "/opt/coragent/locks/wrapper.lock"

["execution"."platforms"."local"."bindings"]

["execution"."platforms"."local"."bindings"."structure"]

["execution"."platforms"."local"."bindings"."structure"."python"]
"manager" = "conda"
"conda_executable" = "/opt/conda/bin/conda"
"prefix" = "/opt/coragent/envs/structure-20261009"
"lock_ref" = "/opt/coragent/locks/structure.lock"

["execution"."platforms"."local"."bindings"."validation"]

["execution"."platforms"."local"."bindings"."validation"."python"]
"manager" = "conda"
"conda_executable" = "/opt/conda/bin/conda"
"prefix" = "/opt/coragent/envs/structure-20261009"
"lock_ref" = "/opt/coragent/locks/structure.lock"

["execution"."platforms"."local"."bindings"."gaussian"]
"command" = "/opt/gaussian/g16/g16"
"activation_script" = "/opt/gaussian/activate.sh"

["execution"."platforms"."local"."bindings"."gaussian"."environment"]
"GAUSS_SCRDIR" = "{scratch}"

["execution"."platforms"."local"."bindings"."xtb"]
"command" = "/opt/xtb/bin/xtb"
"activation_script" = "/opt/xtb/activate.sh"

["execution"."platforms"."local"."bindings"."pyscf"]

["execution"."platforms"."local"."bindings"."pyscf"."python"]
"manager" = "conda"
"conda_executable" = "/opt/conda/bin/conda"
"prefix" = "/opt/coragent/envs/cf22d-20261009"
"lock_ref" = "/opt/coragent/locks/cf22d.lock"

["execution"."platforms"."local"."bindings"."render"]

["execution"."platforms"."local"."bindings"."render"."python"]
"manager" = "conda"
"conda_executable" = "/opt/conda/bin/conda"
"prefix" = "/opt/coragent/envs/render-20261009"
"lock_ref" = "/opt/coragent/locks/render.lock"

["execution"."platforms"."local"."storage"]
"work_root" = "/opt/coragent/jobs"

["execution"."platforms"."local"."schedulers"]

["execution"."platforms"."local"."schedulers"."qrun"]
"executor" = "qrun"

["execution"."platforms"."local"."schedulers"."qrun"."submission"]

["execution"."platforms"."local"."schedulers"."qrun"."submission"."resources"]
"cpus" = 1
"memory_mb" = 1024
