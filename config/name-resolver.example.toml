# Optional one-time input for --name-resolver-config; no resolver is enabled by default.
# The installer imports it into config.toml's [name_resolver] section and generates
# generated/name-resolver.toml (0600). Bind CORAGENT_NAME_RESOLVER_CONFIG explicitly
# in the structure backend environment to a path readable on its selected platform.
default_resolver = "auto"

[backends.pubchem]
enabled = true
endpoint = "https://pubchem.ncbi.nlm.nih.gov/rest/pug"
timeout_seconds = 10
cache = true
# cache_dir = "/absolute/path/to/a/private/cache"
user_agent = "CoRAgent-chemical-name-resolver/1"

# OPSIN provides deterministic IUPAC parsing when PubChem does not index a
# name. Auto lookup tries PubChem, then OPSIN, with an explicit default_resolver first.
[backends.opsin]
enabled = true
endpoint = "https://opsin.ch.cam.ac.uk/opsin"
timeout_seconds = 10
cache = true
user_agent = "CoRAgent-chemical-name-resolver/1"
