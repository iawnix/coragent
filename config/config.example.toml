# Copy to ~/.config/coragent/config.toml. Credentials live beside it in credentials.json.
schema_version = 1

[paths]
software_root = "/home/iaw/soft/coragent"
state_root = "/home/iaw/.local/state/coragent"
workspace_root = "/home/iaw/DATA/coragent/workspaces"

[service]
scope = "user"

[web]
enabled = true
host = "127.0.0.1"
port = 8766

[models.providers]
# Provider definitions use the Pi models format. For a secret field, use
# apiKey = "credential:provider_key" and store the value in credentials.json.

[execution]
schema_version = 2
default_platform = "local"

[execution.platforms.local]
default_scheduler = "qrun"
schedulers.qrun.executor = "qrun"
transport = "local"
storage.work_root = "/opt/coragent/jobs"
# Install Qrun on this host first; use the absolute handler returned by qrun install.
submission = { resources = { cpus = 1, memory_mb = 1024 } }

[notifications.email]
enabled = false
# provider = "smtp"
# preset = "custom"
# host = "smtp.example.com"
# port = 465
# security = "ssl"
# username = "research@example.com"
# recipient = "research@example.com"
# password = "credential:smtp_password"
