# Copy to ~/soft/coragent/config/config.toml. Credentials live beside it in credentials.json.
schema_version = 1

[paths]
software_root = "/home/iaw/soft/coragent"
state_root = "/home/iaw/soft/coragent/state"
workspace_root = "/home/iaw/DATA/coragent/workspaces"

[service]
scope = "user"

[web]
enabled = true
host = "127.0.0.1"
port = 8766

[models.providers]
# Provider definitions use the Pi models format. For a secret field, use
# apiKey = "credential:provider_key" and store the value in credentials.json.

# Execution is optional. Import job.execution.example.toml or job.qrun.example.toml
# explicitly after choosing your platforms; installation does not create a default queue.
# Name lookup is also optional: import name-resolver.example.toml explicitly when needed.

[notifications.email]
enabled = false
# provider = "smtp"
# preset = "custom"
# host = "smtp.example.com"
# port = 465
# security = "ssl"
# username = "research@example.com"
# recipient = "research@example.com"
# password = "credential:smtp_password"
