# Command transport and compute scheduling are configured independently.
[execution]
default_target = "local"

[execution.targets.local]
type = "local"
driver = "systemd" # use process where a user systemd manager is unavailable
scheduler = "none"
location = "controller"
aliases = ["direct"]

[execution.targets.batch]
driver = "external"
transport = "ssh" # use local when CoRAgent runs on the submission host
scheduler = "pbs" # set to slurm or tri when using the corresponding handler
location = "cluster"
aliases = ["queue"]
cluster_name = "cluster"
ssh_host = "login.cluster.example" # omit for local transport
file_mode = "staged" # default: copy inputs and collect outputs
work_root = "/shared/coragent/jobs"
# For direct shared execution, set file_mode = "shared" and work_root to
# the shared workspace parent, e.g. /home/iaw/DATA/coragent/workspaces.
# Controller, submission host and compute nodes must see the same physical paths.
handler = ["/usr/bin/python3", "/opt/coragent/skills/batch-schedulers/scripts/batch.py", "pbs"]
connect_timeout_seconds = 15
command_timeout_seconds = 180
transfer_timeout_seconds = 3600

# Use slurm or torque as the handler's final argument for those schedulers.
# For TRI: scheduler = "tri" and handler = ["/usr/bin/python3", "/opt/coragent/skills/batch-schedulers/scripts/tri.py"]
# Configure TRI_SOCKET under handler_environment and omit submission.queue.
# For Slurm: scheduler = "slurm" and use the batch-schedulers batch.py handler with final argument slurm.

[execution.targets.batch.bindings.xtb]
command = "/opt/xtb/bin/xtb"

[execution.targets.batch.submission]
queue = "batch"

[execution.targets.batch.submission.resources]
cpus = 4
memory_mb = 4096
walltime = "01:00:00"
