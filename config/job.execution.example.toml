["execution"]
"schema_version" = 2
"default_platform" = "local"

["execution"."platforms"]

["execution"."platforms"."local"]
"transport" = "local"
"default_scheduler" = "qrun"
"aliases" = ["direct"]

["execution"."platforms"."local"."storage"]
"work_root" = "/opt/coragent/jobs"

["execution"."platforms"."local"."schedulers"]

["execution"."platforms"."local"."schedulers"."qrun"]
"executor" = "qrun"

["execution"."platforms"."local"."schedulers"."qrun"."submission"]

["execution"."platforms"."local"."schedulers"."qrun"."submission"."resources"]
"cpus" = 1
"memory_mb" = 1024

["execution"."platforms"."batch"]
"transport" = "ssh"
"default_scheduler" = "pbs"
"ssh_host" = "login.cluster.example"
"connect_timeout_seconds" = 15
"command_timeout_seconds" = 180
"transfer_timeout_seconds" = 3600
"aliases" = ["queue"]

["execution"."platforms"."batch"."bindings"]

["execution"."platforms"."batch"."bindings"."xtb"]
"command" = "/opt/xtb/bin/xtb"

["execution"."platforms"."batch"."storage"]
"work_root" = "/shared/coragent/jobs"
"file_mode" = "staged"

["execution"."platforms"."batch"."schedulers"]

["execution"."platforms"."batch"."schedulers"."pbs"]
"executor" = "pbs"
"cluster_name" = "cluster"
"handler" = ["/usr/bin/python3", "/opt/coragent/current/agent/skills/core/batch-schedulers/scripts/batch.py", "pbs"]

["execution"."platforms"."batch"."schedulers"."pbs"."submission"]
"queue" = "batch"

["execution"."platforms"."batch"."schedulers"."pbs"."submission"."resources"]
"cpus" = 4
"memory_mb" = 4096
"walltime" = "01:00:00"
