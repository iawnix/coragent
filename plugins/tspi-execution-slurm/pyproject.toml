[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tspi-execution-slurm"
version = "0.1.0"
description = "Slurm execution adapter for TSPi"
requires-python = ">=3.11"
dependencies = ["coragent>=0.19.0,<0.20.0"]

[project.entry-points."tspi.execution_plugins"]
slurm = "tspi_execution_slurm.plugin:descriptor"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
