[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tspi-execution-pbs"
version = "0.1.0"
description = "PBS and Torque execution adapters for TSPi"
requires-python = ">=3.11"
dependencies = ["coragent>=0.19.0,<0.20.0"]

[project.entry-points."tspi.execution_plugins"]
pbs = "tspi_execution_pbs.plugin:pbs_descriptor"
torque = "tspi_execution_pbs.plugin:torque_descriptor"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
